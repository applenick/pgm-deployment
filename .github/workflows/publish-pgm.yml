name: Publish PGM snapshots

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Force rebuild and publish even if the commit is already published
        type: boolean
        default: false
        required: false

concurrency:
  group: pgm-dev-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
      NOTIFY_PROJECT: PGM
      UPSTREAM_REPOSITORY: PGMDev/PGM
      UPSTREAM_BRANCH: dev
      NOTIFY_ARTIFACTS: |
        tc.oc.pgm:core:0.16-SNAPSHOT
        tc.oc.pgm:util:0.16-SNAPSHOT

    steps:
      - name: Check out publisher
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out PGM dev
        uses: actions/checkout@v7
        with:
          repository: PGMDev/PGM
          ref: dev
          fetch-depth: 0
          path: .work/upstream

      - name: Compare publication state
        id: upstream
        env:
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: ./scripts/resolve-upstream.sh

      - name: Notify Discord of build start
        if: steps.upstream.outputs.should_publish == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
          NOTIFY_STATUS: started
        run: |
          echo "BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          python3 scripts/notify-discord.py

      - name: Set up Java 21
        if: steps.upstream.outputs.should_publish == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.upstream.outputs.should_publish == 'true'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Publish PGM artifacts to Reposilite
        id: publish
        if: steps.upstream.outputs.should_publish == 'true'
        working-directory: .work/upstream
        env:
          REPOSILITE_URL: ${{ secrets.REPOSILITE_URL }}
          REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: |
          ./gradlew \
            --init-script ../../gradle/reposilite.init.gradle \
            :util:publishPgmPublicationToReposiliteRepository \
            :core:publishPgmPublicationToReposiliteRepository

      - name: Record successful publication
        id: state
        if: steps.upstream.outputs.should_publish == 'true'
        run: ./scripts/record-success.sh "${{ steps.upstream.outputs.upstream_sha }}"

      - name: Notify Discord of result
        if: ${{ always() && !cancelled() && steps.upstream.outputs.should_publish == 'true' }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
          NOTIFY_STATUS: ${{ steps.state.outcome == 'success' && 'success' || 'failure' }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          STATE_OUTCOME: ${{ steps.state.outcome }}
        run: python3 scripts/notify-discord.py

      - name: Preserve build outputs after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pgm-publish-failure-${{ github.run_id }}
          path: |
            .work/upstream/build/libs/
            .work/upstream/core/build/libs/
            .work/upstream/util/build/libs/
          if-no-files-found: ignore
          retention-days: 7

